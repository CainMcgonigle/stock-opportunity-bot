services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./seen_articles.json:/app/seen_articles.json
      - ./bot.log:/app/bot.log
    depends_on:
      ollama:
        condition: service_healthy
    stdin_open: true
    tty: true

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_data:
